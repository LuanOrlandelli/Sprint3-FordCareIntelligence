name: FordCare DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fordcare-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fordcare_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fordcare_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fordcare_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test-password
      JWT_SECRET: fordcare-ci-security-test-secret-key-2026-123456789
      SSL_KEYSTORE_PASSWORD: test-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: fordcare-api/pom.xml

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw clean test

      - name: Gerar pacote
        run: ./mvnw package -DskipTests


  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/security-audit
            p/owasp-top-ten


  sca:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "FordCare Intelligence"
          path: "fordcare-api"
          format: "HTML"
          out: "reports"

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/


  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t fordcare-api:security-scan ./fordcare-api

      - name: Executar Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "fordcare-api:security-scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"


  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - sast
      - sca
      - secret-scanning
      - container-security

    steps:
      - name: Aprovar Security Gate
        run: |
          echo "========================================"
          echo " FordCare Intelligence - Security Gate "
          echo "========================================"
          echo ""
          echo "Build e testes: OK"
          echo "SAST - Semgrep: OK"
          echo "SCA - Dependency Check: OK"
          echo "Secret Scanning - Gitleaks: OK"
          echo "Container Security - Trivy: OK"
          echo ""
          echo "Security Gate aprovado."
