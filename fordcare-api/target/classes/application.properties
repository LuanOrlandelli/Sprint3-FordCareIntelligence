spring.application.name=fordcare-api

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fordcare_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

# =========================================================
# PAYLOAD SECURITY
# =========================================================

spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB
server.tomcat.max-http-form-post-size=2097152

# =========================================================
# HTTPS / TLS
# =========================================================

server.port=8080
server.ssl.enabled=false

server.ssl.key-store=${SSL_KEYSTORE_PATH:file:./certs/fordcare.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=fordcare

# =========================================================
# OBSERVABILITY / ACTUATOR
# =========================================================

# Porta separada para gerenciamento e monitoramento
management.server.port=9091

# Somente endpoints necessários
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Não expõe detalhes internos no health
management.endpoint.health.show-details=never

management.endpoint.prometheus.access=read-only

# Identifica as métricas como pertencentes ao FordCare
management.metrics.tags.application=fordcare-api

# Histograma para análise de latência HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO
logging.level.fordcare_api=INFO
logging.level.org.springframework.security=WARN

logging.file.name=logs/fordcare-api.log